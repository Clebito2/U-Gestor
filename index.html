<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live - Acompanhamento de Implantação ERP UGESTOR</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
    <!-- Font Awesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Google Fonts (substitua pelas fontes da Live, se não forem essas) -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <header class="live-header">
        <div class="container">
            <h1 id="project-title"></h1>
            <p id="client-info"></p>
            <div class="project-summary">
                <span>Início: <strong id="startDate"></strong></span>
                <span>Go-Live: <strong id="goLiveDate"></strong></span>
                <span>Término: <strong id="endDate"></strong></span>
            </div>
            <div class="overall-progress-container">
                <div class="progress-bar-label">Progresso Geral do Projeto</div>
                <div class="progress-bar-wrapper">
                    <div class="progress-bar" id="overall-progress-bar"></div>
                </div>
                <span id="overall-progress-text"></span>
            </div>
        </div>
    </header>

    <main class="container main-content">
        <div id="mind-map-container" class="mind-map-grid">
            <!-- As fases e tarefas serão injetadas aqui via JavaScript -->
        </div>
    </main>

    <footer class="live-footer">
        <div class="container">
            <p>&copy; 2025 Live Consultoria. Todos os direitos reservados.</p>
        </div>
    </footer>

    <!-- Carrega os dados do cliente e depois o script principal da aplicação -->
    <script src="js/data-client.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
